<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Biamortier V1 (Lancement 02/2026)</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --primary-color: #004a99;
            --secondary-color: #f4f6f9;
            --accent-color: #e67e22;
            --concrete-color: #7f8c8d;
            --joint-color: #8e44ad;
            --email-color: #27ae60;
            --text-color: #2c3e50;
            --warning-bg: #fffbf0;
            --warning-border: #f6e05e;
            --card-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--secondary-color);
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #002b55 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-container img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
            background: white; 
            padding: 5px;
            border-radius: 5px;
        }

        .header-text h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header-text p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .main-type-switcher {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #e2e8f0;
            gap: 5px;
        }

        .main-type-btn {
            flex: 1;
            padding: 15px 5px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 800;
            font-size: 1rem;
            color: #a0aec0;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 4px solid transparent;
            text-transform: uppercase;
        }

        .main-type-btn:hover { color: var(--primary-color); background-color: #f8fafc; }
        .main-type-btn.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .main-type-btn.active-concrete { color: var(--concrete-color); border-bottom-color: var(--concrete-color); }
        .main-type-btn.active-joint { color: var(--joint-color); border-bottom-color: var(--joint-color); }

        .mode-switcher {
            display: flex;
            background: #e2e8f0;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        
        .mode-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            color: #718096;
            transition: all 0.2s;
        }
        
        .mode-btn.active { background: white; color: var(--primary-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .mode-btn.concrete-active { background: white; color: var(--concrete-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .form-group { margin-bottom: 25px; }
        .hidden-field { display: none; }

        label { display: block; font-weight: 700; margin-bottom: 10px; color: #4a5568; font-size: 0.95rem; }

        select, input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            color: #2d3748;
        }

        .input-with-unit { display: flex; gap: 10px; }
        .input-with-unit input { flex: 2; }
        .input-with-unit select { flex: 1; background-color: #edf2f7; font-weight: bold; }

        #product-visual-container {
            text-align: center; margin-bottom: 25px; min-height: 180px;
            display: flex; align-items: center; justify-content: center;
            background-color: #ffffff; border-radius: 12px; border: 1px dashed #e2e8f0;
            position: relative;
        }

        .visual-wrapper { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
        .product-img { max-height: 160px; opacity: 0; transition: opacity 0.5s ease; mix-blend-mode: multiply; }
        .product-img.visible { opacity: 1; }
        .product-img.hidden { display: none; }
        .visual-wrapper.dual-mode #img-primary { height: 160px; max-width: 48%; }
        .visual-wrapper.dual-mode #img-secondary { height: 135px; max-width: 48%; }

        .visual-badge {
            position: absolute; top: 10px; right: 10px; background: var(--primary-color);
            color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; display: none;
        }

        .dims-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-calc {
            width: 100%; background: linear-gradient(to right, var(--accent-color), #d35400);
            color: white; border: none; padding: 18px; font-size: 1.2rem; font-weight: 800;
            border-radius: 12px; cursor: pointer; margin-top: 15px; text-transform: uppercase;
        }
        .btn-calc.concrete-mode { background: linear-gradient(to right, #95a5a6, #7f8c8d); }
        .btn-calc.joint-mode { background: linear-gradient(to right, #9b59b6, #8e44ad); }

        #result-card {
            background-color: #fff; border-radius: 16px; margin-top: 40px; display: none;
            overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 4px solid var(--primary-color);
        }
        .result-summary { background-color: #ebf8ff; padding: 25px; text-align: center; }
        .result-weight { font-size: 3rem; font-weight: 800; color: var(--primary-color); }

        .contact-form-wrapper { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-top: 30px; }
        .btn-email {
            width: 100%; background: linear-gradient(to right, #27ae60, #2ecc71);
            color: white; border: none; padding: 15px; font-size: 1.1rem; font-weight: 800;
            border-radius: 12px; cursor: pointer; margin-top: 20px; text-transform: uppercase;
        }
        
        .btn-reset-form {
            display: block; margin: 15px auto 0; background: none; border: none;
            color: #a0aec0; font-size: 0.8rem; text-decoration: underline; cursor: pointer;
        }

        .color-preview-circle { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container"><img src="logo.png" alt="Logo"></div>
        <div class="header-text">
            <h1>Calculatrice Matériaux</h1>
            <p>Guide technique & logistique - V1 (Lancement 02/2026)</p>
        </div>
    </header>

    <div class="content">
        <div class="main-type-switcher">
            <button class="main-type-btn active" id="btnMainMortar" onclick="switchMainType('mortar')">Mortier</button>
            <button class="main-type-btn" id="btnMainConcrete" onclick="switchMainType('concrete')">Béton</button>
            <button class="main-type-btn" id="btnMainJoint" onclick="switchMainType('joint')">Joint</button>
        </div>

        <div id="product-visual-container">
            <div id="badge-coated" class="visual-badge">GAMME COATED - M10</div>
            <div class="visual-wrapper" id="visual-wrapper">
                <img id="img-primary" class="product-img" src="" alt="Sac principal">
                <img id="img-secondary" class="product-img hidden" src="" alt="Sac secondaire">
            </div>
        </div>

        <div id="mortar-section">
            <div class="mode-switcher">
                <button class="mode-btn active" id="btnModeSurface" onclick="switchMortarMode('surface')">Par Surface (m²)</button>
                <button class="mode-btn" id="btnModeVolume" onclick="switchMortarMode('volume')">Par Volume</button>
            </div>
            <div class="form-group">
                <label>1. Gamme de produit</label>
                <select id="category" onchange="updateReferences()">
                    <option value="">-- Sélectionner une gamme --</option>
                </select>
            </div>
            <div id="coated-alert" style="display:none; background: var(--warning-bg); padding:15px; border-radius:10px; margin-bottom:20px;">
                <label style="display:flex; align-items:center; cursor:pointer;">
                    <input type="checkbox" id="isCoated" onchange="updateBagVisual()" style="width:20px; margin-right:15px;">
                    <div><strong>Brique Coated (Vandersanden) ?</strong></div>
                </label>
            </div>
            <div id="surface-fields">
                <div class="form-group">
                    <label>2. Référence</label>
                    <select id="reference" disabled onchange="handleReferenceChange()">
                        <option value="">-- Sélectionner dimensions --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>3. Surface (m²)</label>
                    <input type="number" id="surface" placeholder="Ex: 50">
                </div>
            </div>
        </div>

        <div id="concrete-section" class="hidden-field">
            <div class="form-group"><label>Volume souhaité (m³)</label><input type="number" id="inputConcreteVol" placeholder="Ex: 1.5"></div>
        </div>

        <div id="joint-section" class="hidden-field">
            <div class="form-group">
                <label>Dimensions plaquette & joint (mm)</label>
                <div class="dims-grid">
                    <input type="number" id="jointL" placeholder="Long.">
                    <input type="number" id="jointH" placeholder="Haut.">
                    <input type="number" id="jointW" placeholder="Larg.">
                </div>
            </div>
        </div>

        <button id="btnAction" class="btn-calc" onclick="calculate()">CALCULER MA COMMANDE</button>

        <div id="result-card">
            <div class="result-summary">
                <div class="result-weight"><span id="totalWeight">0</span> kg</div>
                <p>Poids Total Nécessaire</p>
            </div>
            <div class="logistics-container">
                <div class="contact-form-wrapper">
                    <label>COORDONNÉES CLIENT (MÉMORISÉES)</label>
                    <input type="text" id="userCompany" placeholder="Entreprise *" style="margin-bottom:10px;">
                    <input type="text" id="userContact" placeholder="Nom Contact *" style="margin-bottom:10px;">
                    <input type="text" id="userDealer" placeholder="Négociant *" style="margin-bottom:10px;">
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
                        <select id="userColor" onchange="updateColorPreview()" style="flex:1;"><option value="">-- Couleur --</option></select>
                        <div id="colorPreview" class="color-preview-circle"></div>
                    </div>
                    <input type="text" id="userRef" placeholder="Réf Chantier *">
                    <button class="btn-reset-form" onclick="resetStoredData()">Réinitialiser mes coordonnées</button>
                </div>
                <button class="btn-email" onclick="sendQuoteEmail()">DEMANDER UN DEVIS PAR EMAIL</button>
            </div>
        </div>
    </div>
</div>

    const colorCtx = document.createElement('canvas').getContext('2d');
    function convertLchToHex(l, c, h) {
        colorCtx.fillStyle = `lch(${l}% ${c} ${h})`;
        colorCtx.fillRect(0,0,1,1);
        const [r,g,b] = colorCtx.getImageData(0,0,1,1).data;
        return `#${(1<<24|r<<16|g<<8|b).toString(16).slice(1)}`;
    }

    function setupPersistence() {
        FIELDS_TO_SAVE.forEach(id => {
            const el = document.getElementById(id);
            el.value = localStorage.getItem('bm_' + id) || "";
            el.oninput = () => localStorage.setItem('bm_' + id, el.value);
        });
    }

    function resetStoredData() {
        if(confirm("Vider vos coordonnées mémorisées ?")) {
            FIELDS_TO_SAVE.forEach(id => {
                localStorage.removeItem('bm_' + id);
                document.getElementById(id).value = "";
            });
        }
    }

    window.onload = () => {
        setupPersistence();
        const catSel = document.getElementById('category');
        const colSel = document.getElementById('userColor');
        for (let k in db) catSel.add(new Option(k, k));
        NUANCIER_COMPLET.forEach(c => {
            const opt = new Option(c.name, c.name);
            opt.dataset.hex = convertLchToHex(c.l, c.c, c.h);
            colSel.add(opt);
        });
    };

    function updateColorPreview() {
        const sel = document.getElementById('userColor');
        const pre = document.getElementById('colorPreview');
        const hex = sel.options[sel.selectedIndex].dataset.hex;
        pre.style.backgroundColor = hex || 'transparent';
    }

    function switchMainType(t) {
        document.getElementById('mortar-section').className = t === 'mortar' ? '' : 'hidden-field';
        document.getElementById('concrete-section').className = t === 'concrete' ? '' : 'hidden-field';
        document.getElementById('joint-section').className = t === 'joint' ? '' : 'hidden-field';
        updateBagVisual();
    }

    function updateReferences() {
        const cat = document.getElementById('category').value;
        const refSel = document.getElementById('reference');
        refSel.innerHTML = '<option value="">-- Choisir --</option>';
        if (cat) {
            refSel.disabled = false;
            db[cat].items.forEach((it, i) => refSel.add(new Option(it.name, i)));
            document.getElementById('coated-alert').style.display = cat.includes("TERRE CUITE") ? "block" : "none";
        } else refSel.disabled = true;
        updateBagVisual();
    }

    function updateBagVisual() {
        const img = document.getElementById('img-primary');
        const cat = document.getElementById('category').value;
        img.classList.remove('visible');
        setTimeout(() => {
            if (cat.includes("BIACOLOR")) img.src = IMG_SAC_BIACOLOR;
            else if (cat.includes("TERRE CUITE")) img.src = IMG_SAC_TERRE_CUITE;
            else img.src = IMG_SAC_BETON;
            img.classList.add('visible');
        }, 100);
    }

    function calculate() {
        const surf = parseFloat(document.getElementById('surface').value) || 0;
        document.getElementById('totalWeight').innerText = (surf * 45).toLocaleString();
        document.getElementById('result-card').style.display = 'block';
    }

    function sendQuoteEmail() {
        const company = document.getElementById('userCompany').value;
        if(!company) { alert("Merci de compléter vos coordonnées."); return; }
        window.location.href = `mailto:contact@biallais.fr?subject=Devis ${company}&body=Demande de prix...`;
    }

</html>
